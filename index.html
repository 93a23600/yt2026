<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>YouTube Clean Player</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        #bar {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999;
            display: flex;
            gap: 8px;
            background: rgba(20, 20, 20, 0.85);
            padding: 6px 14px;
            border-radius: 20px;
            opacity: 0.2;
            transition: opacity 0.2s ease;
        }
        #bar:hover, #bar:focus-within {
            opacity: 1;
        }
        input {
            width: 300px;
            padding: 6px 12px;
            border: 1px solid #555;
            border-radius: 12px;
            background: #111;
            color: #fff;
            font-size: 13px;
            outline: none;
        }
        button {
            padding: 6px 14px;
            background: #e60000;
            color: #fff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #ff1a1a; }
        .crop-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        iframe {
            position: absolute;
            top: -65px;
            left: 0;
            width: 100%;
            height: calc(100% + 65px);
            border: none;
        }
    </style>
</head>
<body>

    <div id="bar">
        <input id="u" placeholder="Dan link YouTube vao day..." autocomplete="off">
        <button onclick="playVideo()">Xem</button>
    </div>

    <div class="crop-container">
        <iframe id="player" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>
    </div>

    <script>
        function getID(url) {
            if (!url) return null;
            var m = url.match(/(?:youtu\.be\/|watch\?v=|embed\/|shorts\/)([a-zA-Z0-9_-]{11})/);
            return m ? m[1] : (url.trim().length === 11 ? url.trim() : null);
        }

        function load(id) {
            if (!id) return;
            window.location.hash = id;
            document.getElementById('player').src = 'https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1&controls=1';
        }

        function playVideo() {
            var val = document.getElementById('u').value.trim();
            var id = getID(val);
            if (id) {
                load(id);
            } else {
                alert('Vui long dan dung link YouTube!');
            }
        }

        document.getElementById('u').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') playVideo();
        });

        window.addEventListener('load', function() {
            var id = window.location.hash.replace('#', '');
            if (id) {
                load(id);
                document.getElementById('u').value = 'https://www.youtube.com/watch?v=' + id;
            }
        });

        window.addEventListener('hashchange', function() {
            var id = window.location.hash.replace('#', '');
            if (id) load(id);
        });
    </script>
</body>
</html>
