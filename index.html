<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình phát video YouTube & Facebook</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        #nav-box {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 999999;
            display: flex;
            align-items: center;
            background: rgba(20, 20, 20, 0.92);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 4px 8px;
            width: 38px;
            height: 38px;
            overflow: hidden;
            opacity: 0.35;
            transition: width 0.25s ease, opacity 0.25s ease, height 0.25s ease;
        }

        #nav-box:hover,
        #nav-box:focus-within {
            width: min(720px, calc(100vw - 24px));
            height: 44px;
            opacity: 1;
            padding: 4px 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
        }

        #nav-icon {
            min-width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 15px;
            cursor: pointer;
            user-select: none;
        }

        #input-wrap {
            display: flex;
            gap: 6px;
            margin-left: 8px;
            width: 100%;
        }

        input {
            flex: 1;
            padding: 6px 12px;
            border: 1px solid #444;
            border-radius: 12px;
            background: #111;
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        input:focus {
            border-color: #ff3333;
        }

        button {
            padding: 6px 14px;
            background: #e60000;
            color: #fff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            white-space: nowrap;
            transition: background 0.2s ease;
        }

        button:hover {
            background: #cc0000;
        }

        .btn-fb {
            background: #1877f2;
        }

        .btn-fb:hover {
            background: #145dbf;
        }

        .btn-open {
            background: #333;
        }

        .btn-open:hover {
            background: #555;
        }

        .video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .yt-mode iframe {
            position: absolute;
            top: -65px;
            left: 0;
            width: 100%;
            height: calc(100% + 65px);
        }
    </style>
</head>
<body>

    <div id="nav-box">
        <div id="nav-icon" title="Rê chuột vào để nhập link">🔍</div>
        <div id="input-wrap">
            <input id="video-input" placeholder="Dán link YouTube hoặc Facebook..." autocomplete="off">
            <button onclick="handlePlay()">Phát</button>
            <button id="fb-btn" class="btn-fb" onclick="loginFB()">Đăng nhập FB</button>
            <button class="btn-open" onclick="openDirect()" title="Mở thẳng sang tab Facebook/YouTube">Mở ngoài</button>
        </div>
    </div>

    <div id="container" class="video-container">
        <iframe id="player" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>
    </div>

    <!-- Tải Facebook SDK -->
    <script async defer crossorigin="anonymous" src="https://connect.facebook.net/vi_VN/sdk.js"></script>

    <script>
        window.fbAsyncInit = function() {
            FB.init({
                appId: '1620713262919921',
                cookie: true,
                xfbml: true,
                version: 'v20.0'
            });

            FB.getLoginStatus(function(response) {
                if (response.status === 'connected') {
                    var btn = document.getElementById("fb-btn");
                    if (btn) {
                        btn.innerText = "Đã kết nối FB";
                        btn.style.opacity = "0.7";
                    }
                }
            });
        };

        function loginFB() {
            if (typeof FB === "undefined") {
                alert("Facebook SDK đang nạp, vui lòng bấm lại sau 2 giây!");
                return;
            }
            FB.login(function(response) {
                if (response.authResponse) {
                    alert("Đăng nhập thành công!");
                    location.reload();
                }
            }, { scope: 'public_profile' });
        }

        var timer = null;
        var navBox = document.getElementById("nav-box");
        var player = document.getElementById("player");
        var input = document.getElementById("video-input");
        var container = document.getElementById("container");

        function resetTimer() {
            navBox.style.opacity = "1";
            clearTimeout(timer);
            timer = setTimeout(function() {
                var isHover = navBox.matches(":hover") || navBox.matches(":focus-within");
                if (!isHover) {
                    navBox.style.opacity = "0.35";
                }
            }, 2500);
        }

        document.addEventListener("mousemove", resetTimer);
        document.addEventListener("mouseleave", function() {
            var isHover = navBox.matches(":hover") || navBox.matches(":focus-within");
            if (!isHover) navBox.style.opacity = "0.35";
        });

        function parseYouTubeID(url) {
            var m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([a-zA-Z0-9_-]{11})/);
            if (m) return m[1];
            if (url.trim().length === 11 && !url.includes("/") && !url.includes(".")) return url.trim();
            return null;
        }

        function isFB(url) {
            return /facebook\.com|fb\.watch/i.test(url);
        }

        function loadVideo(rawUrl) {
            var url = (rawUrl || "").trim();
            if (!url) return;

            if (isFB(url)) {
                container.className = "video-container";
                var cleanFbUrl = url.split("?")[0];
                var fbSrc = "https://www.facebook.com/plugins/video.php?href=" + encodeURIComponent(cleanFbUrl) + "&show_text=false&autoplay=1";
                player.src = fbSrc;
                input.value = cleanFbUrl;
                window.location.hash = "fb=" + encodeURIComponent(cleanFbUrl);
                return;
            }

            var ytId = parseYouTubeID(url);
            if (ytId) {
                container.className = "video-container yt-mode";
                player.src = "https://www.youtube-nocookie.com/embed/" + ytId + "?autoplay=1&controls=1";
                input.value = "https://www.youtube.com/watch?v=" + ytId;
                window.location.hash = "yt=" + ytId;
                return;
            }

            alert("Vui lòng dán link YouTube hoặc Facebook hợp lệ!");
        }

        function handlePlay() {
            loadVideo(input.value);
        }

        function openDirect() {
            var url = (input.value || "").trim();
            if (!url) {
                alert("Hãy dán link video vào ô trước khi bấm mở!");
                return;
            }
            if (isFB(url)) {
                window.open(url, "_blank");
            } else {
                var ytId = parseYouTubeID(url);
                if (ytId) {
                    window.open("https://www.youtube.com/watch?v=" + ytId, "_blank");
                } else {
                    window.open(url, "_blank");
                }
            }
        }

        input.addEventListener("keypress", function(e) {
            if (e.key === "Enter") handlePlay();
        });

        function syncHash() {
            var hash = window.location.hash.replace("#", "");
            if (!hash) return;
            if (hash.startsWith("fb=")) {
                loadVideo(decodeURIComponent(hash.substring(3)));
            } else if (hash.startsWith("yt=")) {
                loadVideo(hash.substring(3));
            } else if (hash.length === 11) {
                loadVideo(hash);
            }
        }

        window.addEventListener("load", syncHash);
        window.addEventListener("hashchange", syncHash);
    </script>
</body>
</html>
