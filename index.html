<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>YouTube Clean</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        #bar {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            gap: 8px;
            background: rgba(15, 15, 15, 0.85);
            padding: 6px 14px;
            border-radius: 20px;
            opacity: 0.15;
            transition: opacity 0.25s ease;
        }
        #bar:hover, #bar:focus-within {
            opacity: 1;
        }
        input {
            width: 280px;
            padding: 6px 12px;
            border: 1px solid #444;
            border-radius: 12px;
            background: #181818;
            color: #fff;
            font-size: 13px;
            outline: none;
        }
        button {
            padding: 6px 14px;
            background: #cc0000;
            color: #fff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
        }
        .crop-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        iframe {
            position: absolute;
            top: -65px;
            left: 0;
            width: 100%;
            height: calc(100% + 65px);
            border: none;
        }
    </style>
</head>
<body>

    <div id="bar">
        <input id="u" placeholder="Dán link YouTube vào đây...">
        <button onclick="playVideo()">Xem</button>
    </div>

    <div class="crop-container">
        <iframe id="player" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>
    </div>

    <script>
        function getID(text) {
            var m = text.match(/(?:youtu\.be\/|watch\?v=|embed\/|shorts\/)([a-zA-Z0-9_-]{11})/);
            return m ? m[1] : (text.trim().length === 11 ? text.trim() : null);
        }

        function load(id) {
            if (!id) return;
            localStorage.setItem('yt_saved_id', id);
            window.location.hash = id;
            document.getElementById('player').src = 'https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1&controls=1';
        }

        function playVideo() {
            var val = document.getElementById('u').value;
            var id = getID(val);
            if (id) {
                load(id);
                document.getElementById('u').value = '';
            } else {
                alert('Link YouTube khong hop le!');
            }
        }

        document.getElementById('u').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') playVideo();
        });

        window.addEventListener('DOMContentLoaded', function() {
            var hashID = window.location.hash.replace('#', '');
            var savedID = localStorage.getItem('yt_saved_id');
            var idToPlay = hashID || savedID;
            if (idToPlay) {
                load(idToPlay);
            }
        });
    </script>
</body>
</html>
