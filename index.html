<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>YouTube Clean Player</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        /* Nút popup nhỏ ở góc trên bên trái */
        #nav-box {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 99999;
            display: flex;
            align-items: center;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(4px);
            border-radius: 20px;
            padding: 4px;
            width: 32px;
            height: 32px;
            overflow: hidden;
            opacity: 0.15;
            transition: width 0.25s ease, opacity 0.2s ease, background 0.2s ease;
            cursor: pointer;
        }

        /* Rê chuột vào hoặc khi đang gõ phím thì tự bung rộng ra */
        #nav-box:hover, #nav-box:focus-within {
            width: 380px;
            height: 38px;
            opacity: 1;
            padding: 4px 8px;
        }

        /* Icon kính lúp / link đại diện ở góc */
        #nav-icon {
            min-width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #aaa;
            font-size: 14px;
            user-select: none;
        }

        #input-wrap {
            display: flex;
            gap: 6px;
            margin-left: 6px;
            width: 100%;
        }

        input {
            flex: 1;
            padding: 4px 10px;
            border: 1px solid #444;
            border-radius: 12px;
            background: #111;
            color: #fff;
            font-size: 12px;
            outline: none;
        }

        button {
            padding: 4px 12px;
            background: #e60000;
            color: #fff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
        }
        button:hover { background: #ff1a1a; }

        .crop-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        iframe {
            position: absolute;
            top: -65px;
            left: 0;
            width: 100%;
            height: calc(100% + 65px);
            border: none;
        }
    </style>
</head>
<body>

    <div id="nav-box">
        <div id="nav-icon">🔍</div>
        <div id="input-wrap">
            <input id="u" placeholder="Dán link YouTube vào đây..." autocomplete="off">
            <button onclick="playVideo()">Xem</button>
        </div>
    </div>

    <div class="crop-container">
        <iframe id="player" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>
    </div>

    <script>
        function getID(url) {
            if (!url) return null;
            var m = url.match(/(?:youtu\.be\/|watch\?v=|embed\/|shorts\/)([a-zA-Z0-9_-]{11})/);
            return m ? m[1] : (url.trim().length === 11 ? url.trim() : null);
        }

        function load(id) {
            if (!id) return;
            window.location.hash = id;
            document.getElementById('player').src = 'https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1&controls=1';
        }

        function playVideo() {
            var val = document.getElementById('u').value.trim();
            var id = getID(val);
            if (id) {
                load(id);
            } else {
                alert('Vui lòng dán đúng link YouTube!');
            }
        }

        document.getElementById('u').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') playVideo();
        });

        window.addEventListener('load', function() {
            var id = window.location.hash.replace('#', '');
            if (id) {
                load(id);
                document.getElementById('u').value = 'https://www.youtube.com/watch?v=' + id;
            }
        });

        window.addEventListener('hashchange', function() {
            var id = window.location.hash.replace('#', '');
            if (id) load(id);
        });
    </script>
</body>
</html>
