<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>YT Clean Player</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        #bar {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            gap: 8px;
            background: rgba(15, 15, 15, 0.85);
            padding: 6px 14px;
            border-radius: 20px;
            opacity: 0.15;
            transition: opacity 0.25s ease;
        }
        #bar:hover, #bar:focus-within {
            opacity: 1;
        }
        input {
            width: 280px;
            padding: 6px 12px;
            border: 1px solid #444;
            border-radius: 12px;
            background: #181818;
            color: #fff;
            font-size: 13px;
            outline: none;
        }
        button {
            padding: 6px 14px;
            background: #cc0000;
            color: #fff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover { background: #ff0000; }
        .wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <div id="bar">
        <input id="u" placeholder="Dan link YouTube vao day...">
        <button onclick="playVideo()">Xem</button>
    </div>

    <div class="wrapper">
        <iframe id="player" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>
    </div>

    <script>
        function getID(text) {
            var m = text.match(/(?:youtu\.be\/|watch\?v=|embed\/|shorts\/)([a-zA-Z0-9_-]{11})/);
            return m ? m[1] : (text.length === 11 ? text : null);
        }

        function load(id) {
            if (!id) return;
            localStorage.setItem('last_yt_id', id);
            window.location.hash = id;
            var src = 'https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1&modestbranding=1&rel=0&iv_load_policy=3&showinfo=0';
            document.getElementById('player').src = src;
        }

        function playVideo() {
            var val = document.getElementById('u').value.trim();
            var id = getID(val);
            if (id) {
                load(id);
                document.getElementById('u').value = '';
            } else {
                alert('Link YouTube khong hop le!');
            }
        }

        document.getElementById('u').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') playVideo();
        });

        window.onload = function() {
            var hashID = window.location.hash.replace('#', '');
            var lastID = localStorage.getItem('last_yt_id');
            var startID = hashID || lastID;
            if (startID) load(startID);
        };
    </script>
</body>
</html>
