<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>YouTube Full Window</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
        #bar {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            gap: 8px;
            background: rgba(25, 25, 25, 0.85);
            padding: 8px 14px;
            border-radius: 25px;
            opacity: 0.25;
            transition: opacity 0.2s;
        }
        #bar:hover, #bar:focus-within { opacity: 1; }
        #url-input {
            width: 280px;
            padding: 6px 12px;
            border: 1px solid #444;
            border-radius: 16px;
            background: #111;
            color: #fff;
            outline: none;
            font-size: 13px;
        }
        button {
            padding: 6px 14px;
            background: #e60000;
            color: #fff;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        #player {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>

    <div id="bar">
        <input type="text" id="url-input" placeholder="Dan link YouTube vao day...">
        <button onclick="playVideo()">Xem ngay</button>
    </div>

    <div id="player"></div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        var player = null;

        function extractID(url) {
            var m = url.match(/(?:youtu\.be\/|watch\?v=|embed\/|shorts\/)([\w-]{11})/);
            return m ? m[1] : null;
        }

        function playVideo() {
            var val = document.getElementById('url-input').value.trim();
            var id = extractID(val);
            if (!id) {
                alert('Link YouTube khong hop le!');
                return;
            }

            if (player && typeof player.loadVideoById === 'function') {
                player.loadVideoById(id);
            } else {
                player = new YT.Player('player', {
                    videoId: id,
                    host: 'https://www.youtube-nocookie.com',
                    playerVars: {
                        autoplay: 1,
                        playsinline: 1,
                        origin: 'https://www.youtube.com',
                        enablejsapi: 1
                    }
                });
            }
        }

        document.getElementById('url-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') playVideo();
        });
    </script>
</body>
</html>
